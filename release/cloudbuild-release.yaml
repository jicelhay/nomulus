# To manually trigger a build on GCB, run:
# gcloud builds submit --config cloudbuild-release.yaml --substitutions \
#   TAG_NAME=[TAG],_INTERNAL_REPO_URL=[URL],_TEST_PROJECT=[_TEST_PROJECT] \
#   ..
#
# To trigger a build automatically, follow the instructions below and add a trigger:
# https://cloud.google.com/cloud-build/docs/running-builds/automate-builds
#
# This pipeline prepares a release. The pipeline should be run against the Nomulus public repo on
# GitHub. It builds the builder and base images, and hard codes the sha256 hashes of the resulting
# images in the merged code base (internal + public), which is tagged and pushed into the release
# repo. Actual release artifacts are built from the release repo, ensuring reproducibility.
steps:
# Check the out internal repo.
- name: 'gcr.io/cloud-builders/git'
  entrypoint: /bin/bash
  env:
    - '_INTERNAL_REPO_URL=${_INTERNAL_REPO_URL}'
  args:
  - -c
  - |
    set -e
    git clone https://gerrit.googlesource.com/gcompute-tools
    sed -i s@/usr/bin/python@/usr/bin/python3@g ./gcompute-tools/git-cookie-authdaemon
    ./gcompute-tools/git-cookie-authdaemon
    git clone "$_INTERNAL_REPO_URL" nomulus-internal
# Tag and push the internal repo.
- name: 'gcr.io/cloud-builders/git'
  entrypoint: /bin/bash
  env:
    - 'TAG_NAME=${TAG_NAME}'
  args:
  - -c
  - |
    set -e
    git tag "$TAG_NAME"
    git push origin "$TAG_NAME"
  dir: 'nomulus-internal'
# Merge the repos and remove environment configs from .gitignore.
- name: 'gcr.io/cloud-builders/git'
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -e
    bash ./release/prepare_merged_tree.sh merge
# Build the builder image and pull the base images, them upload them to GCR.
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: /bin/bash
  env:
    - 'PROJECT_ID=${PROJECT_ID}'
    - 'TAG_NAME=${TAG_NAME}'
  args:
  - -c
  - |
    set -e
    docker build -t "gcr.io/${PROJECT_ID}/builder:${TAG_NAME}" .
    docker tag "gcr.io/${PROJECT_ID}/builder:${TAG_NAME}" "gcr.io/${PROJECT_ID}/builder:latest"
    docker push "gcr.io/${PROJECT_ID}/builder:${TAG_NAME}"
    docker push "gcr.io/${PROJECT_ID}/builder:latest"
    docker pull jetty:12-jdk25
    docker tag jetty:12-jdk25 "gcr.io/${PROJECT_ID}/jetty:${TAG_NAME}"
    docker tag jetty:12-jdk25 "gcr.io/${PROJECT_ID}/jetty:latest"
    docker push "gcr.io/${PROJECT_ID}/jetty:${TAG_NAME}"
    docker push "gcr.io/${PROJECT_ID}/jetty:latest"
    docker pull eclipse-temurin:25
    docker tag eclipse-temurin:25 "gcr.io/${PROJECT_ID}/temurin:${TAG_NAME}"
    docker tag eclipse-temurin:25 "gcr.io/${PROJECT_ID}/temurin:latest"
    docker push "gcr.io/${PROJECT_ID}/temurin:${TAG_NAME}"
    docker push "gcr.io/${PROJECT_ID}/temurin:latest"
  dir: 'release/builder/'
# Build and upload the schema_deployer image.
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -e
    docker build -t gcr.io/${PROJECT_ID}/schema_deployer:${TAG_NAME} --build-arg TAG_NAME=${TAG_NAME} --build-arg PROJECT_ID=${PROJECT_ID} .
    docker tag gcr.io/${PROJECT_ID}/schema_deployer:${TAG_NAME} \
      gcr.io/${PROJECT_ID}/schema_deployer:latest
    docker push gcr.io/${PROJECT_ID}/schema_deployer:${TAG_NAME}
    docker push gcr.io/${PROJECT_ID}/schema_deployer:latest
  dir: 'release/schema-deployer/'
# Build and upload the schema_verifier image.
- name: 'gcr.io/cloud-builders/docker'
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -e
    docker build -t gcr.io/${PROJECT_ID}/schema_verifier:${TAG_NAME} --build-arg TAG_NAME=${TAG_NAME} --build-arg PROJECT_ID=${PROJECT_ID} .
    docker tag gcr.io/${PROJECT_ID}/schema_verifier:${TAG_NAME} \
      gcr.io/${PROJECT_ID}/schema_verifier:latest
    docker push gcr.io/${PROJECT_ID}/schema_verifier:${TAG_NAME}
    docker push gcr.io/${PROJECT_ID}/schema_verifier:latest
  dir: 'release/schema-verifier/'
# Upload the Gradle binary to GCS if it does not exist. This must run before the next step, which
# points URL in Gradle wrapper to it.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: /bin/bash
  args:
  - -c
  - |
    set -e
    gradle_url=$(grep distributionUrl gradle/wrapper/gradle-wrapper.properties \
      | awk -F = '{print $2}' | sed 's/\\//g')
    gradle_bin=$(basename $gradle_url)
    gcs_loc="domain-registry-maven-repository/gradle"
    curl -O -L ${gradle_url}
    if gcloud storage objects describe gs://${gcs_loc}/${gradle_bin}
    then
      local_md5=$(md5sum ${gradle_bin} | awk '{print $1}')
      remote_md5=$(gcloud storage hash --hex gs://${gcs_loc}/${gradle_bin} | grep md5 | awk '{print $2}')
      if [[ ${local_md5} != ${remote_md5} ]]
      then
        echo "ERROR: MD5 hash mismatch for ${gradle_bin}! Local (official): ${local_md5}, Remote (GCS cache): ${remote_md5}. Aborting build." >&2
        exit 1
      fi
    else
      gcloud storage cp $gradle_bin gs://${gcs_loc}/
    fi
    rm ${gradle_bin}
# Do text replacement in the merged repo, hardcoding image digests and generating the cloud build
# YAML files and k8s manifests for each environment. See release/prepare_merged_tree.sh.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: /bin/bash
  env:
    - 'PROJECT_ID=${PROJECT_ID}'
    - 'TAG_NAME=${TAG_NAME}'
  args:
  - -c
  - |
    set -e
    bash ./release/prepare_merged_tree.sh pin ${PROJECT_ID} ${TAG_NAME}
# Conditionally trigger the appropriate build based on the tag format and promote artifacts.
- name: 'gcr.io/cloud-builders/gcloud'
  entrypoint: 'bash'
  env:
    - 'TAG_NAME=${TAG_NAME}'
    - 'PROJECT_ID=${PROJECT_ID}'
  args:
  - -c
  - |
    set -e
    # Check for a nomulus release tag (e.g., "v1.2.3")
    if [[ "$TAG_NAME" =~ ^nomulus-20[0-9]{2}[0-1][0-9][0-3][0-9]-RC[0-9]{2}$ ]]; then
      echo "Tag format matches a nomulus release. Triggering nomulus build..."
      gcloud builds submit . --config=release/cloudbuild-nomulus.yaml --substitutions="TAG_NAME=$TAG_NAME,_TREE_PREPARED=true"
      echo "Promoting and signing nomulus release artifacts..."
      bash ./release/promote_artifacts.sh "nomulus" "$TAG_NAME" "$PROJECT_ID"
    # Check for a proxy release tag (e.g., "proxy-v1.2.3")
    elif [[ "$TAG_NAME" =~ ^proxy-20[0-9]{2}[0-1][0-9][0-3][0-9]-RC[0-9]{2}$ ]]; then
      echo "Tag format matches a proxy release. Triggering proxy build..."
      gcloud builds submit . --config=release/cloudbuild-proxy.yaml --substitutions="TAG_NAME=$TAG_NAME,_TREE_PREPARED=true"
      echo "Promoting and signing proxy release artifacts..."
      bash ./release/promote_artifacts.sh "proxy" "$TAG_NAME" "$PROJECT_ID"
    else
      echo "Tag format '$TAG_NAME' does not match a known release type. Exiting."
      exit 1
    fi
# Create a release in Cloud Deploy to trigger the deployment pipeline
- name: 'gcr.io/$PROJECT_ID/builder:latest'
  entrypoint: /bin/bash
  env:
    - 'TAG_NAME=${TAG_NAME}'
    - 'PROJECT_ID=${PROJECT_ID}'
  args:
  - -c
  - |
    set -e
    if [[ "$TAG_NAME" =~ ^nomulus-20[0-9]{2}[0-1][0-9][0-3][0-9]-RC[0-9]{2}$ ]]; then
      echo "============================================="
      echo "Triggering Google Cloud Deploy Release"
      echo "============================================="
      echo "Tag Name: ${TAG_NAME}"
      echo "Project ID: ${PROJECT_ID}"
      pipeline="deploy-nomulus"
      region="us-central1"
      # Release names must consist of lowercase letters, numbers, and hyphens.
      release_name=$(echo "${TAG_NAME}" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
      echo "Release Name: $release_name"
      echo "============================================="
      nomulus_digest=$(gcloud artifacts docker images describe \
        "us-docker.pkg.dev/${PROJECT_ID}/gcr.io/nomulus:${TAG_NAME}" \
        --format="value(image_summary.digest)")
      proxy_digest=$(gcloud artifacts docker images describe \
        "us-docker.pkg.dev/${PROJECT_ID}/gcr.io/proxy:${TAG_NAME}" \
        --format="value(image_summary.digest)")
      gcloud deploy releases create "$release_name" \
        --delivery-pipeline="$pipeline" \
        --region="$region" \
        --project=${PROJECT_ID} \
        --images="gcr.io/${PROJECT_ID}/nomulus=gcr.io/${PROJECT_ID}/nomulus@${nomulus_digest},gcr.io/${PROJECT_ID}/proxy=gcr.io/${PROJECT_ID}/proxy@${proxy_digest}" \
        --source=. \
        --skaffold-file=release/clouddeploy/skaffold.yaml \
        --deploy-parameters="deployed_image=gcr.io/${PROJECT_ID}/nomulus@${nomulus_digest},base_image=us-docker.pkg.dev/${PROJECT_ID}/gcr.io/nomulus,tag_name=${TAG_NAME},project_id=${PROJECT_ID}"
    fi
# Run the BEAM smoke test, using the builder and pipeline image just created
- name: 'gcr.io/$PROJECT_ID/builder:latest'
  entrypoint: /bin/bash
  env:
    - 'TAG_NAME=${TAG_NAME}'
    - 'PROJECT_ID=${PROJECT_ID}'
    - '_TEST_PROJECT=${_TEST_PROJECT}'
  args:
    - -c
    - |
      set -e
      if [[ "$TAG_NAME" =~ ^nomulus-20[0-9]{2}[0-1][0-9][0-3][0-9]-RC[0-9]{2}$ ]]; then
        gcloud secrets versions access latest \
          --secret nomulus-tool-cloudbuild-credential > tool-credential.json
        gcloud auth activate-service-account --key-file=tool-credential.json
        ./release/run_beam_smoketest.sh "$TAG_NAME" "$PROJECT_ID" "$_TEST_PROJECT"
      fi
timeout: 5400s
options:
  machineType: 'E2_HIGHCPU_32'
